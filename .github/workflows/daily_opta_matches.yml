name: Daily Pipeline (Opta Matches & Ratings)

on:
  schedule:
    # Todos los días a las 04:00 UTC
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      competition_id:
        description: 'Código de liga Soccerdonna (ej. ESP1). En blanco = todas las activas en /admin'
        required: false
        default: ''

concurrency:
  group: daily-opta-matches
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SDAPI_OUTLET_KEY: ${{ secrets.SDAPI_OUTLET_KEY }}

jobs:
  sync-opta-matches:
    name: Descarga partidos, horarios y ratings (1-10)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt -c pipeline/constraints.txt
      - name: Sync Opta fixtures, schedules & player ratings
        env:
          COMP_ID: ${{ github.event.inputs.competition_id }}
        run: python -m pipeline.opta_matches

