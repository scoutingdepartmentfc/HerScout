name: Data Pipeline (Opta semanal + Soccerdonna mensual)
run-name: >-
  ${{ github.event.schedule == '0 3 * * 2' && 'Opta semanal (última temporada + calendario)'
  || github.event.schedule == '0 3 1 * *' && 'Soccerdonna mensual'
  || format('Manual: {0} {1}', inputs.modo, inputs.competition_id) }}

on:
  schedule:
    # Opta: todos los martes a las 03:00 UTC (04:00/05:00 en Madrid). Solo la última temporada de cada liga
    # (plantillas, partidos nuevos y calendario con horarios) + ligas/temporadas recién elegidas en /admin
    - cron: '0 3 * * 2'
    # Soccerdonna: el día 1 de cada mes a las 03:00 UTC (fichas, valor de mercado, traspasos, lesiones)
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      modo:
        description: 'opta = solo API Opta (última temporada); soccerdonna = solo Soccerdonna; todo = ambas, todas las temporadas; recalcular = ratings desde la caché'
        type: choice
        options: [opta, soccerdonna, todo, recalcular, jugadoras, clasico]
        required: false
        default: opta
      competition_id:
        description: 'Código de liga Soccerdonna (ESP1...) en modos opta/soccerdonna/todo; ID Opta en jugadoras/clasico. En blanco = todas las de /admin'
        required: false
        default: ''
      todas_temporadas:
        description: 'Opta: descargar todas las temporadas elegidas, no solo la última'
        type: boolean
        required: false
        default: false
      refresco_dias:
        description: 'Soccerdonna: releer las fichas guardadas hace más de N días (en blanco = 25; 0 = todas)'
        required: false
        default: ''
      max_matches:
        description: 'Máximo de partidos NUEVOS por liga (en blanco = todos los pendientes)'
        required: false
        default: ''
      extra_args:
        description: 'Flags extra: --rebuild, --skip-photos, --only-photos, --refresh-photos'
        required: false
        default: ''
      limite:
        description: 'Soccerdonna y fotos solo para N jugadoras (pruebas; en blanco = todas)'
        required: false
        default: ''
      catalogo:
        description: 'Actualizar antes el catálogo Opta del panel /admin (tarda bastante)'
        type: boolean
        required: false
        default: false

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  data-pipeline:
    runs-on: ubuntu-latest
    # La primera carga (ligas + fotos) tarda bastante; las semanales, minutos.
    # Si se corta, la siguiente ejecución continúa donde lo dejó (caché por lotes).
    timeout-minutes: 330

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SDAPI_OUTLET_KEY: ${{ secrets.SDAPI_OUTLET_KEY }}

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt -c pipeline/constraints.txt

      - name: Tests del motor
        run: python -m unittest discover -s tests/pipeline -t tests/pipeline

      - name: Catálogo Opta (ligas y temporadas disponibles en /admin)
        if: github.event.inputs.catalogo == 'true'
        run: python -m pipeline.catalogo

      # 1. Plantillas Opta → jugadoras (matchName, dorsal, nacimiento, lugar...), partidos y estadísticas.
      # 2. Fotos FotMob confirmando matchName + dorsal de la temporada actual + fecha de nacimiento.
      # Modo jugadoras: ligas de /admin → Opta (plantillas, partidos jugados y por jugar,
      # eventing + matchstats, valoración por partido) → Soccerdonna (perfil en inglés) → fotos FotMob
      - name: Jugadoras (Opta + Soccerdonna + FotMob)
        if: github.event_name == 'workflow_dispatch' && inputs.modo == 'jugadoras'
        env:
          COMP_ID: ${{ github.event.inputs.competition_id }}
          MAX_MATCHES: ${{ github.event.inputs.max_matches }}
          LIMITE: ${{ github.event.inputs.limite }}
        run: |
          ARGS=""
          [ -n "$COMP_ID" ] && ARGS="$ARGS --comp-id $COMP_ID"
          [ -n "$MAX_MATCHES" ] && ARGS="$ARGS --max-matches $MAX_MATCHES"
          [ -n "$LIMITE" ] && ARGS="$ARGS --limit $LIMITE"
          python -m pipeline.jugadoras $ARGS

      # Ligas de /admin (Soccerdonna Leagues + temporadas Opta). Martes → opta; día 1 → soccerdonna; manual → el modo elegido
      - name: Ligas de /admin (Opta / Soccerdonna)
        if: github.event_name == 'schedule' || contains(fromJSON('["opta","soccerdonna","todo","recalcular"]'), inputs.modo)
        env:
          CRON: ${{ github.event.schedule }}
          MODO: ${{ inputs.modo }}
          LIGA: ${{ inputs.competition_id }}
          LIMITE: ${{ inputs.limite }}
          MAX_MATCHES: ${{ inputs.max_matches }}
          TODAS: ${{ inputs.todas_temporadas }}
          REFRESCO: ${{ inputs.refresco_dias }}
        run: |
          case "$CRON" in
            '0 3 * * 2') MODO=opta ;;
            '0 3 1 * *') MODO=soccerdonna ;;
          esac
          ARGS="--refresco-dias ${REFRESCO:-25}"
          [ -n "$LIGA" ] && ARGS="$ARGS --liga $LIGA"
          [ -n "$LIMITE" ] && ARGS="$ARGS --limit $LIMITE"
          [ -n "$MAX_MATCHES" ] && ARGS="$ARGS --max-matches $MAX_MATCHES"
          [ "$TODAS" = "true" ] && ARGS="$ARGS --todas-temporadas"
          case "$MODO" in
            opta) ACCION=actualizar-opta ;;
            soccerdonna) ACCION=actualizar-soccerdonna ;;
            recalcular) ACCION=recalcular ;;
            *) ACCION=todo ;;
          esac
          echo "▶ python -m pipeline.sd_ligas $ACCION $ARGS"
          python -m pipeline.sd_ligas $ACCION $ARGS

      - name: Opta + fotos FotMob
        if: github.event_name == 'workflow_dispatch' && inputs.modo == 'clasico'
        env:
          COMP_ID: ${{ github.event.inputs.competition_id }}
          MAX_MATCHES: ${{ github.event.inputs.max_matches }}
          EXTRA_ARGS: ${{ github.event.inputs.extra_args }}
        run: |
          ARGS=""
          [ -n "$COMP_ID" ] && ARGS="$ARGS --comp-id $COMP_ID"
          [ -n "$MAX_MATCHES" ] && ARGS="$ARGS --max-matches $MAX_MATCHES"
          python -m pipeline.ingest $ARGS $EXTRA_ARGS

      # 3. Soccerdonna: perfil, valor de mercado, traspasos, lesiones y selección, confirmando fecha y lugar de
      # nacimiento, dorsal y club. Las nuevas siempre; las demás cada 30 días. Si falla no tumba la descarga.
      - name: Enriquecer jugadoras con Soccerdonna
        if: success() && github.event_name == 'workflow_dispatch' && inputs.modo == 'clasico' && !contains(github.event.inputs.extra_args, '--only-photos')
        continue-on-error: true
        env:
          COMP_ID: ${{ github.event.inputs.competition_id }}
        run: |
          ARGS="--refresh-days 30"
          [ -n "$COMP_ID" ] && ARGS="$ARGS --comp-id $COMP_ID"
          python -m pipeline.soccerdonna $ARGS

      # 4. Coche escoba ceroacero.es: SIEMPRE al final (aunque falle un paso anterior). Solo rellena lo que siga
      # vacío (foto, nacimiento, nacionalidad, pie, altura, peso, contrato y fichajes si no hay ninguno).
      # Máximo 60 min por ejecución; continúa en la siguiente (cz_updated_at). Si falla no tumba el pipeline.
      - name: Coche escoba (ceroacero.es)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          LIMITE: ${{ github.event.inputs.limite }}
        run: |
          ARGS="--refresh-days 30 --max-minutos 60"
          [ -n "$LIMITE" ] && ARGS="$ARGS --limit $LIMITE"
          python -m pipeline.ceroacero $ARGS
