name: Weekly Pipeline (Soccerdonna + FotMob + Opta Stats)

on:
  schedule:
    # Todos los miércoles a las 03:00 UTC
    - cron: '0 3 * * 3'
  workflow_dispatch:
    inputs:
      competition_id:
        description: 'Código de liga Soccerdonna (ej. ESP1). En blanco = todas las activas en /admin'
        required: false
        default: ''

concurrency:
  group: weekly-soccerdonna-pipeline
  cancel-in-progress: false

env:
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
  SDAPI_OUTLET_KEY: ${{ secrets.SDAPI_OUTLET_KEY }}

jobs:
  sync-soccerdonna:
    name: 1. Descarga Soccerdonna (incremental)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt -c pipeline/constraints.txt
      - name: Sync Soccerdonna leagues & players
        env:
          COMP_ID: ${{ github.event.inputs.competition_id }}
        run: python -m pipeline.soccerdonna_sync

  sync-fotmob-photos:
    name: 2. Fotos FotMob (por parecido)
    needs: sync-soccerdonna
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt -c pipeline/constraints.txt
      - name: Match & download FotMob photos
        run: python -m pipeline.fotmob_photos

  link-opta-players:
    name: 3. Vincular ligas y jugadoras con Opta
    needs: sync-soccerdonna
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt -c pipeline/constraints.txt
      - name: Link Soccerdonna <-> Opta players
        env:
          COMP_ID: ${{ github.event.inputs.competition_id }}
        run: python -m pipeline.link_opta

  sync-opta-stats:
    name: 4. Descarga Stats y Eventing Opta
    needs: link-opta-players
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt
      - run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt -c pipeline/constraints.txt
      - name: Sync Opta stats & eventing
        env:
          COMP_ID: ${{ github.event.inputs.competition_id }}
        run: python -m pipeline.opta_stats

